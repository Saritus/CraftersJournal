# Publica en CurseForge al crear una etiqueta de versión (por ejemplo v1.0.0).
#
# Necesita en GitHub (Settings > Secrets and variables > Actions):
#   CF_API_KEY: token de la API de CurseForge (https://authors.curseforge.com/account/api-tokens)
# y en CraftersJournal.toc la línea  ## X-Curse-Project-ID: <número del proyecto>
#
# El empaquetador (BigWigsMods/packager) arma el zip según .pkgmeta y lo sube con
# las notas de CHANGELOG.md. La versión de juego es la de WoW Forever (1.60.1).
name: Publicar en CurseForge

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La versión del .toc es la de la etiqueta sin la v (v0.64.0 -> 0.64.0). El
      # empaquetador pondría la etiqueta tal cual en @project-version@; así el .toc ya
      # llega sustituido. Si no queda una versión de números, no se publica
      - name: Versión de la etiqueta en el .toc
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+)+$' || { echo "Etiqueta sin versión válida: $GITHUB_REF_NAME"; exit 1; }
          sed -i "s/^## Version: @project-version@/## Version: $version/" CraftersJournal.toc
          grep -q "^## Version: $version\s*$" CraftersJournal.toc || { echo "No se pudo poner la versión en el .toc"; exit 1; }

      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1
